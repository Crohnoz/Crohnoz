name: Profile Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-contract:
    name: Public profile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public profile contract
        run: python .github/scripts/profile_contract.py
