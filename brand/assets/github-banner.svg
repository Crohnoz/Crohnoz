<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Enrique Flores · Crohnoz Labs</title>
  <desc id="desc">Premium GitHub profile hero for Enrique Flores, founder and product systems architect at Crohnoz Labs, highlighting FDR as the current flagship system.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="brandLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#151827"/><stop offset="100%" stop-color="#0E111B"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .kicker{font:700 16px Inter,Arial,sans-serif;letter-spacing:5px;fill:#AAB3C5}.name{font:800 68px Sora,Inter,Arial,sans-serif;fill:#F8FAFC;letter-spacing:-2px}.role{font:700 26px Inter,Arial,sans-serif;fill:#D7DCE7}.copy{font:500 21px Inter,Arial,sans-serif;fill:#AAB3C5}.micro{font:700 13px Inter,Arial,sans-serif;letter-spacing:2px;fill:#D8DEEA}.panelTitle{font:800 36px Inter,Arial,sans-serif;fill:#F8FAFC}.panelCopy{font:600 17px Inter,Arial,sans-serif;fill:#AAB3C5}.pill{font:800 13px Inter,Arial,sans-serif;letter-spacing:1px;fill:#F8FAFC}
    </style>
  </defs>

  <rect width="1600" height="560" fill="#0A0B14"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <circle cx="1450" cy="40" r="420" fill="#8B5CF6" opacity=".07"/>
  <circle cx="80" cy="560" r="320" fill="#06B6D4" opacity=".05"/>
  <rect x="54" y="46" width="1492" height="4" rx="2" fill="url(#brandLine)"/>

  <!-- brand mark -->
  <g transform="translate(74 92) scale(.38)" filter="url(#glow)">
    <rect x="0" y="72" width="26" height="150" rx="13" fill="url(#brand)"/><rect x="38" y="38" width="26" height="66" rx="13" fill="url(#brand)"/><rect x="38" y="116" width="26" height="132" rx="13" fill="url(#brand)"/><rect x="76" y="20" width="26" height="230" rx="13" fill="url(#brand)"/><rect x="114" y="0" width="26" height="280" rx="13" fill="url(#brand)"/><rect x="152" y="44" width="26" height="70" rx="13" fill="url(#brand)"/><rect x="152" y="128" width="26" height="142" rx="13" fill="url(#brand)"/><rect x="190" y="28" width="26" height="230" rx="13" fill="url(#brand)"/><rect x="228" y="66" width="26" height="64" rx="13" fill="url(#brand)"/><rect x="228" y="148" width="26" height="94" rx="13" fill="url(#brand)"/>
  </g>
  <text x="190" y="118" class="kicker">CROHNOZ LABS · FOUNDER PROFILE</text>

  <text x="74" y="214" class="name">ENRIQUE FLORES</text>
  <text x="76" y="257" class="role">Founder · Product &amp; Systems Architect</text>
  <text x="76" y="311" class="copy">I turn real operational problems into working systems.</text>

  <g transform="translate(76 350)">
    <rect width="188" height="40" rx="20" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".55"/><text x="24" y="25" class="pill">PRODUCT ENGINEERING</text>
    <rect x="202" width="154" height="40" rx="20" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".55"/><text x="230" y="25" class="pill">BACKEND SYSTEMS</text>
    <rect x="370" width="166" height="40" rx="20" fill="#06B6D4" fill-opacity=".12" stroke="#06B6D4" stroke-opacity=".55"/><text x="397" y="25" class="pill">SECURE OPERATIONS</text>
  </g>

  <text x="76" y="452" class="micro">CHILE → GLOBAL · PROBLEM → SYSTEM → EVIDENCE → SCALE</text>
  <text x="76" y="500" style="font:600 14px Inter,Arial,sans-serif;letter-spacing:2.2px;fill:#697386">SOFTWARE · HARDWARE · APPLIED AI · AUTOMATION · SECURITY · DELIVERY</text>

  <!-- flagship panel -->
  <g transform="translate(1040 92)">
    <rect width="480" height="380" rx="28" fill="url(#panel)" stroke="#8B5CF6" stroke-opacity=".35"/>
    <rect x="24" y="24" width="432" height="3" rx="1.5" fill="url(#brandLine)"/>
    <text x="34" y="69" class="kicker">CURRENT FLAGSHIP</text>
    <text x="34" y="126" class="panelTitle">FDR</text>
    <text x="34" y="157" class="panelCopy">Healthcare Operations Platform</text>

    <g transform="translate(34 190)">
      <rect width="412" height="54" rx="14" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".08"/>
      <circle cx="27" cy="27" r="8" fill="#06B6D4"/><text x="48" y="23" class="micro">MATURITY</text><text x="48" y="40" style="font:800 14px Inter,Arial,sans-serif;fill:#F8FAFC">L2+ · ADVANCED PILOT</text>
    </g>
    <g transform="translate(34 258)">
      <rect width="198" height="78" rx="15" fill="#FFFFFF" fill-opacity=".045"/><text x="18" y="27" class="micro">ENGINEERING</text><text x="18" y="51" class="panelCopy">Domain contracts</text><text x="18" y="69" style="font:600 12px Inter,Arial,sans-serif;fill:#697386">privacy · lifecycle · tests</text>
      <rect x="214" width="198" height="78" rx="15" fill="#FFFFFF" fill-opacity=".045"/><text x="232" y="27" class="micro">PUBLIC PROOF</text><text x="232" y="51" class="panelCopy">Safe live demo</text><text x="232" y="69" style="font:600 12px Inter,Arial,sans-serif;fill:#697386">sanitized case study</text>
    </g>
    <text x="34" y="366" style="font:700 13px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#8B5CF6">FLAGSHIP · EVIDENCE FIRST</text>
  </g>
</svg>