<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Enrique Flores · Crohnoz Labs</title>
  <desc id="desc">Premium founder profile hero for Enrique Flores, Product and Systems Architect at Crohnoz Labs, with FDR as the current flagship.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#141725"/><stop offset="100%" stop-color="#0E111A"/></linearGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".10"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".018" stroke-width="1"/></pattern>
    <style>
      .kicker{font:700 16px Inter,Arial,sans-serif;letter-spacing:5px;fill:#AAB3C5}.name{font:800 68px Sora,Inter,Arial,sans-serif;fill:#F8FAFC;letter-spacing:-2px}.role{font:700 26px Inter,Arial,sans-serif;fill:#D7DCE7}.copy{font:500 21px Inter,Arial,sans-serif;fill:#AAB3C5}.micro{font:700 13px Inter,Arial,sans-serif;letter-spacing:2px;fill:#C8D0DC}.panelTitle{font:800 38px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.panelCopy{font:600 17px Inter,Arial,sans-serif;fill:#AAB3C5}.pill{font:800 13px Inter,Arial,sans-serif;letter-spacing:.8px;fill:#E9EDF4}
    </style>
  </defs>

  <rect width="1600" height="560" fill="#0A0B14"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <circle cx="1420" cy="40" r="420" fill="url(#ambient)"/>
  <circle cx="90" cy="560" r="300" fill="#06B6D4" opacity=".025"/>
  <rect x="54" y="46" width="1492" height="2" rx="1" fill="url(#line)" opacity=".82"/>

  <g transform="translate(74 92) scale(.36)">
    <rect x="0" y="72" width="26" height="150" rx="13" fill="url(#brand)"/><rect x="38" y="38" width="26" height="66" rx="13" fill="url(#brand)"/><rect x="38" y="116" width="26" height="132" rx="13" fill="url(#brand)"/><rect x="76" y="20" width="26" height="230" rx="13" fill="url(#brand)"/><rect x="114" y="0" width="26" height="280" rx="13" fill="url(#brand)"/><rect x="152" y="44" width="26" height="70" rx="13" fill="url(#brand)"/><rect x="152" y="128" width="26" height="142" rx="13" fill="url(#brand)"/><rect x="190" y="28" width="26" height="230" rx="13" fill="url(#brand)"/><rect x="228" y="66" width="26" height="64" rx="13" fill="url(#brand)"/><rect x="228" y="148" width="26" height="94" rx="13" fill="url(#brand)"/>
  </g>

  <text x="184" y="118" class="kicker">CROHNOZ LABS · FOUNDER PROFILE</text>
  <text x="74" y="214" class="name">ENRIQUE FLORES</text>
  <text x="76" y="258" class="role">Founder · Product &amp; Systems Architect</text>
  <text x="76" y="316" class="copy">I turn operational complexity into working systems.</text>

  <g transform="translate(76 358)">
    <rect width="194" height="42" rx="21" fill="#EC4899" fill-opacity=".07" stroke="#EC4899" stroke-opacity=".32"/><text x="25" y="26" class="pill">PRODUCT ENGINEERING</text>
    <rect x="210" width="160" height="42" rx="21" fill="#8B5CF6" fill-opacity=".07" stroke="#8B5CF6" stroke-opacity=".32"/><text x="239" y="26" class="pill">BACKEND SYSTEMS</text>
    <rect x="386" width="172" height="42" rx="21" fill="#06B6D4" fill-opacity=".07" stroke="#06B6D4" stroke-opacity=".32"/><text x="414" y="26" class="pill">SECURE OPERATIONS</text>
  </g>

  <text x="76" y="474" class="micro">CHILE → GLOBAL · PROBLEM → SYSTEM → EVIDENCE → SCALE</text>

  <g transform="translate(1052 92)">
    <rect width="468" height="352" rx="30" fill="url(#panel)" stroke="#8B5CF6" stroke-opacity=".22"/>
    <rect x="28" y="26" width="412" height="2" rx="1" fill="url(#line)" opacity=".72"/>
    <text x="34" y="72" class="kicker">CURRENT FLAGSHIP</text>
    <text x="34" y="128" class="panelTitle">FDR</text>
    <text x="34" y="159" class="panelCopy">Healthcare Operations Platform</text>

    <g transform="translate(34 194)">
      <rect width="400" height="58" rx="16" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".06"/>
      <circle cx="28" cy="29" r="7" fill="#06B6D4"/><text x="49" y="24" class="micro">MATURITY</text><text x="49" y="43" style="font:800 14px Inter,Arial,sans-serif;fill:#F8FAFC">L2+ · ADVANCED PILOT</text>
    </g>

    <g transform="translate(34 270)">
      <rect width="192" height="58" rx="15" fill="#FFFFFF" fill-opacity=".03"/><text x="18" y="24" class="micro">ENGINEERING</text><text x="18" y="44" class="panelCopy">Domain contracts</text>
      <rect x="208" width="192" height="58" rx="15" fill="#FFFFFF" fill-opacity=".03"/><text x="226" y="24" class="micro">PUBLIC PROOF</text><text x="226" y="44" class="panelCopy">Safe live demo</text>
    </g>
  </g>
</svg>