<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Professional engagement areas</title>
  <desc id="desc">Four areas where Enrique Flores and Crohnoz Labs can contribute: product and systems architecture, operational software, backend integrity and applied AI automation.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <style>.eyebrow{font:700 17px Inter,Arial,sans-serif;letter-spacing:4px;fill:#AAB3C5}.h1{font:800 40px Inter,Arial,sans-serif;fill:#F8FAFC}.title{font:800 23px Inter,Arial,sans-serif;fill:#F8FAFC}.copy{font:500 15px Inter,Arial,sans-serif;fill:#AAB3C5}.tag{font:800 12px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#D8DEEA}</style>
  </defs>
  <rect width="1600" height="520" rx="32" fill="#0A0B14"/>
  <rect x="55" y="48" width="1490" height="4" rx="2" fill="url(#brand)"/>
  <text x="70" y="101" class="eyebrow">PROFESSIONAL ENGAGEMENT</text>
  <text x="70" y="154" class="h1">Best fit: systems where software must understand the operation.</text>
  <text x="70" y="190" class="copy">Architecture, delivery and automation focused on real workflows rather than feature volume.</text>

  <g transform="translate(70 235)"><rect width="340" height="190" rx="22" fill="#10131D" stroke="#EC4899" stroke-opacity=".55"/><text x="24" y="42" class="tag">01 · ARCHITECT</text><text x="24" y="82" class="title">Product &amp; Systems</text><text x="24" y="108" class="title">Architecture</text><text x="24" y="142" class="copy">Domain boundaries · workflows</text><text x="24" y="166" class="copy">product structure · technical direction</text></g>
  <g transform="translate(445 235)"><rect width="340" height="190" rx="22" fill="#10131D" stroke="#8B5CF6" stroke-opacity=".55"/><text x="24" y="42" class="tag">02 · BUILD</text><text x="24" y="82" class="title">Operational</text><text x="24" y="108" class="title">Software</text><text x="24" y="142" class="copy">Django · APIs · data workflows</text><text x="24" y="166" class="copy">role-aware interfaces · delivery</text></g>
  <g transform="translate(820 235)"><rect width="340" height="190" rx="22" fill="#10131D" stroke="#3B82F6" stroke-opacity=".55"/><text x="24" y="42" class="tag">03 · HARDEN</text><text x="24" y="82" class="title">Backend Integrity</text><text x="24" y="108" class="title">&amp; Modernization</text><text x="24" y="142" class="copy">Scope · security · reliability</text><text x="24" y="166" class="copy">testing · observability · CI/CD</text></g>
  <g transform="translate(1195 235)"><rect width="335" height="190" rx="22" fill="#10131D" stroke="#06B6D4" stroke-opacity=".55"/><text x="24" y="42" class="tag">04 · AUTOMATE</text><text x="24" y="82" class="title">Applied AI</text><text x="24" y="108" class="title">&amp; Automation</text><text x="24" y="142" class="copy">Agents · workflows · intelligence</text><text x="24" y="166" class="copy">human-in-the-loop operations</text></g>

  <text x="70" y="476" class="copy">AUDIT · ARCHITECT · BUILD · HARDEN · AUTOMATE · IMPROVE</text>
</svg>