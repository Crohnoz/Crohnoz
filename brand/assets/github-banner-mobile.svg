ycle</text><rect x="334" y="276" width="278" height="80" rx="16" fill="#FFFFFF" fill-opacity=".045"/><text x="354" y="306" class="k">PUBLIC PROOF</text><text x="354" y="336" class="s">Safe demo · case study</text></g><text x="40" y="857" class="k">PROBLEM → SYSTEM → EVIDENCE → SCALE</text></svg>