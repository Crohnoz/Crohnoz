<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">Crohnoz Fresh Market operational product R&amp;D case</title><desc id="desc">L1 prototype focused on perishable inventory, receiving, traceability, continuity and backend controls.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06B6D4"/><stop offset="55%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient><style>.ey{font:800 20px Inter,Arial,sans-serif;letter-spacing:5px;fill:#B7C0CF}.h{font:900 68px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 24px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 18px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 21px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 17px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 17px Inter,Arial,sans-serif;letter-spacing:1.8px;fill:#DDE5EF}</style></defs><rect width="1600" height="520" rx="30" fill="#0A0B14"/><rect x="2" y="2" width="1596" height="516" rx="28" fill="none" stroke="#27384A"/><rect x="0" y="0" width="12" height="520" rx="6" fill="url(#g)"/><text x="70" y="64" class="ey">OPERATIONAL PRODUCT R&amp;D · PUBLIC EVIDENCE</text><text x="70" y="142" class="h">Crohnoz Fresh Market</text><text x="70" y="187" class="sub">Model fresh-retail operations where inventory state, time and continuity matter.</text><g transform="translate(70 222)"><rect width="260" height="52" rx="26" fill="#0D2430" stroke="#06B6D4"/><text x="130" y="33" text-anchor="middle" class="pill">L1 · PROTOTYPE / R&amp;D</text></g><g transform="translate(70 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#06B6D4"/><text x="26" y="38" class="name">PERISHABLE INVENTORY</text><text x="26" y="69" class="body">Lots · receiving · FEFO · waste · adjustments</text><text x="26" y="94" class="body">Stock truth depends on operational context.</text></g><g transform="translate(580 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#3B82F6"/><text x="26" y="38" class="name">WRITE INTEGRITY</text><text x="26" y="69" class="body">Idempotency · concurrency · server boundaries</text><text x="26" y="94" class="body">Avoid silent drift as workflows become shared.</text></g><g transform="translate(1090 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#8B5CF6"/><text x="26" y="38" class="name">CONTINUITY</text><text x="26" y="69" class="body">Local mode · remote state · recovery thinking</text><text x="26" y="94" class="body">Keep operations understandable when links fail.</text></g><text x="800" y="474" text-anchor="middle" class="flow">RECEIVING → LOTS → ORDERS → PREPARATION → WASTE → TRACEABILITY</text></svg>