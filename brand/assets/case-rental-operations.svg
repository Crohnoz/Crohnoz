<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">Rental Operations selected operational engineering case</title><desc id="desc">Non-flagship operational evidence focused on financial rules, traceability, environment isolation and data authorization.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A855F7"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient><style>.ey{font:800 20px Inter,Arial,sans-serif;letter-spacing:5px;fill:#B7C0CF}.h{font:900 68px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 24px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 17px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 21px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 17px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 17px Inter,Arial,sans-serif;letter-spacing:1.6px;fill:#DDE5EF}</style></defs><rect width="1600" height="520" rx="30" fill="#0A0B14"/><rect x="2" y="2" width="1596" height="516" rx="28" fill="none" stroke="#37304C"/><rect x="0" y="0" width="12" height="520" rx="6" fill="url(#g)"/><text x="70" y="64" class="ey">OPERATIONAL ENGINEERING · PUBLIC EVIDENCE</text><text x="70" y="142" class="h">Rental Operations</text><text x="70" y="187" class="sub">Make financial rules, payment evidence and data boundaries explicit.</text><g transform="translate(70 222)"><rect width="360" height="52" rx="26" fill="#21172F" stroke="#A855F7"/><text x="180" y="33" text-anchor="middle" class="pill">CURATED OPERATIONAL EVIDENCE · NON-FLAGSHIP</text></g><g transform="translate(70 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#A855F7"/><text x="26" y="38" class="name">FINANCIAL RULES</text><text x="26" y="69" class="body">Charges · rounding · settlements · vouchers</text><text x="26" y="94" class="body">Make operator-visible accounting behavior explicit.</text></g><g transform="translate(580 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#8B5CF6"/><text x="26" y="38" class="name">ENVIRONMENT ISOLATION</text><text x="26" y="69" class="body">Public demo ≠ private operational data</text><text x="26" y="94" class="body">Separate demonstration from the trust boundary.</text></g><g transform="translate(1090 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#06B6D4"/><text x="26" y="38" class="name">DATA AUTHORIZATION</text><text x="26" y="69" class="body">Auth · PostgreSQL · Row Level Security</text><text x="26" y="94" class="body">Enforce ownership at the data layer.</text></g><text x="800" y="474" text-anchor="middle" class="flow">CHARGE → PAYMENT → EVIDENCE → SETTLEMENT · DEMO / PRIVATE BOUNDARIES</text></svg>