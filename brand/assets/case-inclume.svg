<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">IncluMe inclusive product R&amp;D case</title><desc id="desc">L1 early product focused on accessibility, citizen contribution, municipal review and trust loops.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#A855F7"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient><style>.ey{font:800 20px Inter,Arial,sans-serif;letter-spacing:5px;fill:#B7C0CF}.h{font:900 72px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 24px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 18px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 21px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 17px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 17px Inter,Arial,sans-serif;letter-spacing:1.8px;fill:#DDE5EF}</style></defs><rect width="1600" height="520" rx="30" fill="#0A0B14"/><rect x="2" y="2" width="1596" height="516" rx="28" fill="none" stroke="#3A2D4B"/><rect x="0" y="0" width="12" height="520" rx="6" fill="url(#g)"/><text x="70" y="64" class="ey">INCLUSIVE PRODUCT DESIGN · PUBLIC EVIDENCE</text><text x="70" y="145" class="h">IncluMe</text><text x="70" y="188" class="sub">Accessibility information designed as a citizen + institutional trust workflow.</text><g transform="translate(70 222)"><rect width="230" height="52" rx="26" fill="#2A1326" stroke="#EC4899"/><text x="115" y="33" text-anchor="middle" class="pill">L1 · EARLY PRODUCT</text></g><g transform="translate(70 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#EC4899"/><text x="26" y="38" class="name">CITIZEN DISCOVERY</text><text x="26" y="69" class="body">Map · search · contributions · corrections</text><text x="26" y="94" class="body">Make accessibility information easier to find.</text></g><g transform="translate(580 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#A855F7"/><text x="26" y="38" class="name">REVIEW BOUNDARY</text><text x="26" y="69" class="body">Citizen input ≠ trusted institutional state</text><text x="26" y="94" class="body">Separate contribution from verification.</text></g><g transform="translate(1090 310)"><rect width="440" height="112" rx="20" fill="#101522" stroke="#06B6D4"/><text x="26" y="38" class="name">FEEDBACK LOOP</text><text x="26" y="69" class="body">Submission · review · status · correction</text><text x="26" y="94" class="body">Trust improves through explicit evidence cycles.</text></g><text x="800" y="474" text-anchor="middle" class="flow">DISCOVER → REPORT → REVIEW → STATUS → CORRECT → IMPROVE</text></svg>