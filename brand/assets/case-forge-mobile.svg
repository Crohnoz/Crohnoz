<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc"><title id="title">Crohnoz Forge product R&amp;D case mobile</title><desc id="desc">Mobile case-study header for Crohnoz Forge L1 prototype.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><style>.ey{font:800 22px Inter,Arial,sans-serif;letter-spacing:4px;fill:#B7C0CF}.h{font:900 70px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 28px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 22px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 25px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 22px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 20px Inter,Arial,sans-serif;letter-spacing:1px;fill:#DDE5EF}</style></defs><rect width="900" height="1120" rx="34" fill="#0A0B14"/><rect x="2" y="2" width="896" height="1116" rx="32" fill="none" stroke="#313855"/><rect x="0" y="0" width="14" height="1120" rx="7" fill="url(#g)"/><text x="54" y="72" class="ey">PRODUCT REASONING</text><text x="54" y="158" class="h">Crohnoz Forge</text><text x="54" y="210" class="sub">Structured decisions before implementation.</text><g transform="translate(54 250)"><rect width="330" height="62" rx="31" fill="#18142A" stroke="#8B5CF6"/><text x="165" y="40" text-anchor="middle" class="pill">L1 · PROTOTYPE / R&amp;D</text></g><g transform="translate(54 360)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#EC4899"/><text x="30" y="48" class="name">DISCOVERY</text><text x="30" y="92" class="body">Problem · users · constraints · assumptions</text><text x="30" y="132" class="body">Make uncertainty explicit before choosing</text><text x="30" y="164" class="body">what should be built.</text></g><g transform="translate(54 580)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#8B5CF6"/><text x="30" y="48" class="name">EVIDENCE + STAGE GATES</text><text x="30" y="92" class="body">Observations · tests · readiness · progression</text><text x="30" y="132" class="body">Advance only when the learning criteria</text><text x="30" y="164" class="body">for the current stage are satisfied.</text></g><g transform="translate(54 800)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#3B82F6"/><text x="30" y="48" class="name">LOCAL-FIRST HANDOFF</text><text x="30" y="92" class="body">Explicit persistence · Markdown · .forge.json</text><text x="30" y="132" class="body">Portable product reasoning without a hidden</text><text x="30" y="164" class="body">remote dependency.</text></g><text x="450" y="1046" text-anchor="middle" class="flow">DISCOVER → BLUEPRINT → PROTOTYPE → TEST → OUTCOME</text></svg>