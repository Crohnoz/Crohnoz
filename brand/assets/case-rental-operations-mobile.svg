<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc"><title id="title">Rental Operations selected operational engineering case mobile</title><desc id="desc">Mobile case-study header for Rental Operations selected operational evidence.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A855F7"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient><style>.ey{font:800 22px Inter,Arial,sans-serif;letter-spacing:4px;fill:#B7C0CF}.h{font:900 58px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 27px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 18px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 25px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 22px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 18px Inter,Arial,sans-serif;letter-spacing:.7px;fill:#DDE5EF}</style></defs><rect width="900" height="1120" rx="34" fill="#0A0B14"/><rect x="2" y="2" width="896" height="1116" rx="32" fill="none" stroke="#37304C"/><rect x="0" y="0" width="14" height="1120" rx="7" fill="url(#g)"/><text x="54" y="72" class="ey">OPERATIONAL ENGINEERING</text><text x="54" y="150" class="h">Rental Operations</text><text x="54" y="202" class="sub">Rules, traceability and data boundaries.</text><g transform="translate(54 244)"><rect width="470" height="62" rx="31" fill="#21172F" stroke="#A855F7"/><text x="235" y="40" text-anchor="middle" class="pill">CURATED EVIDENCE · NON-FLAGSHIP</text></g><g transform="translate(54 354)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#A855F7"/><text x="30" y="48" class="name">FINANCIAL RULES</text><text x="30" y="92" class="body">Charges · rounding · settlements · vouchers</text><text x="30" y="132" class="body">Accounting behavior stays explicit and</text><text x="30" y="164" class="body">visible to the operator.</text></g><g transform="translate(54 574)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#8B5CF6"/><text x="30" y="48" class="name">ENVIRONMENT ISOLATION</text><text x="30" y="92" class="body">Public demo ≠ private operational data</text><text x="30" y="132" class="body">Demonstration and private operation live</text><text x="30" y="164" class="body">behind different trust boundaries.</text></g><g transform="translate(54 794)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#06B6D4"/><text x="30" y="48" class="name">DATA AUTHORIZATION</text><text x="30" y="92" class="body">Auth · PostgreSQL · Row Level Security</text><text x="30" y="132" class="body">Ownership is enforced at the data layer,</text><text x="30" y="164" class="body">not inferred from UI state.</text></g><text x="450" y="1044" text-anchor="middle" class="flow">CHARGE → PAY → EVIDENCE → SETTLE</text></svg>