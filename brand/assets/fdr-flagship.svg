<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">FDR — Crohnoz Labs flagship system</title>
  <desc id="desc">Flagship engineering card for FDR showing maturity, operational focus and three core engineering proof areas.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899" stop-opacity=".10"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity=".08"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".08"/></linearGradient>
    <style>.ey{font:700 20px Inter,Arial,sans-serif;letter-spacing:5px;fill:#AAB4C3}.h1{font:900 112px Sora,Inter,Arial,sans-serif;letter-spacing:4px;fill:#F8FAFC}.h2{font:700 32px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 23px Inter,Arial,sans-serif;fill:#B8C2D0}.small{font:700 17px Inter,Arial,sans-serif;letter-spacing:1.7px;fill:#DDE4ED}.pill{font:800 17px Inter,Arial,sans-serif;fill:#F8FAFC}.muted{font:600 16px Inter,Arial,sans-serif;fill:#8F9BAB}</style>
  </defs>
  <rect width="1600" height="650" rx="34" fill="#0A0B14"/>
  <rect x="2" y="2" width="1596" height="646" rx="32" fill="none" stroke="url(#g)" stroke-width="2" stroke-opacity=".72"/>
  <circle cx="1460" cy="80" r="360" fill="none" stroke="#8B5CF6" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="130" cy="610" r="280" fill="none" stroke="#06B6D4" stroke-opacity=".06" stroke-width="2"/>

  <text x="78" y="82" class="ey">FEATURED FLAGSHIP · ENGINEERING EVIDENCE</text>
  <text x="78" y="214" class="h1">FDR</text>
  <text x="78" y="268" class="h2">Healthcare Operations Platform</text>
  <text x="78" y="314" class="body">Clinical and administrative workflows shaped around explicit operational contracts.</text>

  <g transform="translate(78 350)"><rect width="334" height="60" rx="30" fill="url(#soft)" stroke="#8B5CF6" stroke-opacity=".55"/><circle cx="31" cy="30" r="8" fill="#8B5CF6"/><text x="55" y="38" class="small">L2+ · ADVANCED PILOT</text></g>

  <text x="78" y="474" class="small">WHAT THIS SYSTEM PROVES</text>
  <g transform="translate(78 505)">
    <rect width="420" height="88" rx="20" fill="#0F131D" stroke="#FFFFFF" stroke-opacity=".07"/><text x="24" y="34" class="pill">DOMAIN INTEGRITY</text><text x="24" y="61" class="muted">Booking scope enforced server-side</text>
    <rect x="444" width="420" height="88" rx="20" fill="#0F131D" stroke="#FFFFFF" stroke-opacity=".07"/><text x="468" y="34" class="pill">WORKFLOW TRUTH</text><text x="468" y="61" class="muted">Lifecycle states reflect real operation</text>
    <rect x="888" width="420" height="88" rx="20" fill="#0F131D" stroke="#FFFFFF" stroke-opacity=".07"/><text x="912" y="34" class="pill">CONTROLLED DELIVERY</text><text x="912" y="61" class="muted">Privacy · staging · targeted regressions</text>
  </g>
</svg>