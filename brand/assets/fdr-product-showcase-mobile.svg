<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" role="img" aria-labelledby="title desc"><title id="title">FDR Product Surfaces</title><desc id="desc">Mobile sanitized reconstruction of implemented FDR professional workspace, public booking and professional presence surfaces.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EC4899"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><style>.k{font:700 14px Inter,Arial,sans-serif;letter-spacing:3px;fill:#AAB3C5}.h{font:800 33px Inter,Arial,sans-serif;fill:#F8FAFC}.w{font:800 20px Inter,Arial,sans-serif;fill:#111827}.c{font:600 15px Inter,Arial,sans-serif;fill:#64748B}.l{font:800 13px Inter,Arial,sans-serif;fill:#334155}.x{font:800 14px Inter,Arial,sans-serif;fill:#0F766E}</style></defs><rect width="720" height="1250" rx="30" fill="#0A0B14"/><rect x="32" y="35" width="656" height="4" rx="2" fill="url(#g)"/><text x="38" y="84" class="k">FDR · PRODUCT SURFACES</text><text x="38" y="132" class="h">Implemented, operable, inspectable.</text><text x="38" y="165" style="font:500 16px Inter,Arial,sans-serif;fill:#AAB3C5">Sanitized reconstruction · fictitious labels only</text><g transform="translate(38 210)"><rect width="644" height="330" rx="24" fill="#F8FAFC"/><rect width="644" height="44" rx="24" fill="#E2E8F0"/><rect y="24" width="644" height="20" fill="#E2E8F0"/><text x="24" y="30" class="l">PROFESSIONAL WORKSPACE</text><text x="24" y="82" class="w">Daily clinical workspace</text><text x="24" y="108" class="c">Next attention, state-aware actions and daily metrics.</text><rect x="24" y="132" width="596" height="84" rx="16" fill="#0F172A"/><text x="44" y="163" style="font:800 12px Inter,Arial,sans-serif;fill:#94A3B8">NEXT ATTENTION</text><text x="44" y="193" style="font:800 23px Inter,Arial,sans-serif;fill:#F8FAFC">10:30 · Demo patient</text><g transform="translate(24 236)"><rect width="184" height="66" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="14" y="27" class="c">TODAY</text><text x="14" y="51" class="x">06</text><rect x="206" width="184" height="66" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="220" y="27" class="c">PENDING</text><text x="220" y="51" class="x">02</text><rect x="412" width="184" height="66" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="426" y="27" class="c">CLOSED</text><text x="426" y="51" class="x">03</text></g></g><g transform="translate(38 575)"><rect width="644" height="270" rx="24" fill="#F8FAFC"/><rect width="644" height="44" rx="24" fill="#E2E8F0"/><rect y="24" width="644" height="20" fill="#E2E8F0"/><text x="24" y="30" class="l">PUBLIC BOOKING</text><text x="24" y="82" class="w">Reserve an appointment</text><text x="24" y="108" class="c">Service → professional → real availability → review.</text><g transform="translate(24 140)"><circle cx="20" cy="20" r="20" fill="#0F766E"/><text x="15" y="26" style="font:800 13px Inter,Arial,sans-serif;fill:#fff">1</text><text x="52" y="25" class="l">Booking data</text><line x1="176" y1="20" x2="212" y2="20" stroke="#CBD5E1" stroke-width="3"/><circle cx="238" cy="20" r="20" fill="#E2E8F0"/><text x="233" y="26" class="l">2</text><text x="270" y="25" class="l">Review</text><line x1="350" y1="20" x2="386" y2="20" stroke="#CBD5E1" stroke-width="3"/><circle cx="412" cy="20" r="20" fill="#E2E8F0"/><text x="407" y="26" class="l">3</text><text x="444" y="25" class="l">Confirmation</text></g><rect x="24" y="205" width="596" height="40" rx="12" fill="#ECFDF5"/><text x="42" y="231" style="font:700 13px Inter,Arial,sans-serif;fill:#047857">Server validation protects service / professional / slot scope</text></g><g transform="translate(38 880)"><rect width="644" height="270" rx="24" fill="#F8FAFC"/><rect width="644" height="44" rx="24" fill="#E2E8F0"/><rect y="24" width="644" height="20" fill="#E2E8F0"/><text x="24" y="30" class="l">PROFESSIONAL PRESENCE</text><text x="24" y="82" class="w">Controlled public profile</text><text x="24" y="108" class="c">Publication and verification remain separate from clinical data.</text><g transform="translate(24 142)"><rect width="184" height="78" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="14" y="29" class="c">PUBLICATION</text><text x="14" y="57" style="font:800 15px Inter,Arial,sans-serif;fill:#047857">PUBLISHED</text><rect x="206" width="184" height="78" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="220" y="29" class="c">VERIFICATION</text><text x="220" y="57" style="font:800 15px Inter,Arial,sans-serif;fill:#7C3AED">SEPARATE</text><rect x="412" width="184" height="78" rx="14" fill="#fff" stroke="#DDE4EC"/><text x="426" y="29" class="c">PRIVACY</text><text x="426" y="57" style="font:800 15px Inter,Arial,sans-serif;fill:#0F766E">BOUNDARY</text></g></g><text x="38" y="1207" class="k">IMPLEMENTED SURFACES · NO REAL PATIENT DATA</text></svg>