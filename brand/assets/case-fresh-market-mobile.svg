<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc"><title id="title">Crohnoz Fresh Market operational product R&amp;D case mobile</title><desc id="desc">Mobile case-study header for the Fresh Market L1 prototype.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06B6D4"/><stop offset="55%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient><style>.ey{font:800 22px Inter,Arial,sans-serif;letter-spacing:4px;fill:#B7C0CF}.h{font:900 60px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 27px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 22px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 25px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 22px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 19px Inter,Arial,sans-serif;letter-spacing:.8px;fill:#DDE5EF}</style></defs><rect width="900" height="1120" rx="34" fill="#0A0B14"/><rect x="2" y="2" width="896" height="1116" rx="32" fill="none" stroke="#27384A"/><rect x="0" y="0" width="14" height="1120" rx="7" fill="url(#g)"/><text x="54" y="72" class="ey">OPERATIONAL PRODUCT R&amp;D</text><text x="54" y="150" class="h">Fresh Market</text><text x="54" y="202" class="sub">Perishable operations need explicit rules.</text><g transform="translate(54 244)"><rect width="330" height="62" rx="31" fill="#0D2430" stroke="#06B6D4"/><text x="165" y="40" text-anchor="middle" class="pill">L1 · PROTOTYPE / R&amp;D</text></g><g transform="translate(54 354)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#06B6D4"/><text x="30" y="48" class="name">PERISHABLE INVENTORY</text><text x="30" y="92" class="body">Lots · receiving · FEFO · waste</text><text x="30" y="132" class="body">Stock truth depends on time, movement</text><text x="30" y="164" class="body">and operational context.</text></g><g transform="translate(54 574)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#3B82F6"/><text x="30" y="48" class="name">WRITE INTEGRITY</text><text x="30" y="92" class="body">Idempotency · concurrency · server boundaries</text><text x="30" y="132" class="body">Prevent silent drift as workflows become</text><text x="30" y="164" class="body">shared across clients.</text></g><g transform="translate(54 794)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#8B5CF6"/><text x="30" y="48" class="name">CONTINUITY</text><text x="30" y="92" class="body">Local mode · remote state · recovery</text><text x="30" y="132" class="body">Keep the operation understandable when</text><text x="30" y="164" class="body">connectivity is unreliable.</text></g><text x="450" y="1044" text-anchor="middle" class="flow">RECEIVE → STOCK → PREPARE → ADJUST → TRACE</text></svg>