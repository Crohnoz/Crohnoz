<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Crohnoz product portfolio maturity</title>
  <desc id="desc">Maturity view showing FDR as flagship advanced pilot and Forge, Fresh Market and IncluMe as earlier-stage products.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <style>
      .head{font:800 28px Sora,Inter,Arial,sans-serif;letter-spacing:4px;fill:#F8FAFC}
      .sub{font:500 19px Inter,Arial,sans-serif;fill:#9EABBC}
      .name{font:800 28px Inter,Arial,sans-serif;fill:#F8FAFC}
      .meta{font:600 18px Inter,Arial,sans-serif;fill:#AAB5C4}
      .stage{font:800 18px Inter,Arial,sans-serif;fill:#F8FAFC}
      .tiny{font:700 15px Inter,Arial,sans-serif;fill:#CBD5E1;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="560" rx="30" fill="#0A0B14"/>
  <rect x="2" y="2" width="1596" height="556" rx="28" fill="none" stroke="#27324A"/>
  <text x="70" y="68" class="head">CURRENT PRODUCT PORTFOLIO</text>
  <text x="70" y="103" class="sub">Maturity is shown honestly: flagship delivery first, exploratory products second.</text>

  <text x="970" y="70" class="tiny">L0 IDEA</text><text x="1095" y="70" class="tiny">L1 PROTOTYPE</text><text x="1245" y="70" class="tiny">L2 PILOT</text><text x="1370" y="70" class="tiny">L3 PROD</text><text x="1480" y="70" class="tiny">L4 SCALE</text>
  <line x1="985" y1="95" x2="1520" y2="95" stroke="#27324A" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(70 145)">
    <rect width="1460" height="88" rx="22" fill="#101522" stroke="#8B5CF6" stroke-width="2"/>
    <text x="28" y="38" class="name">FDR</text><text x="28" y="66" class="meta">Healthcare operations · flagship system</text>
    <rect x="575" y="20" width="280" height="48" rx="24" fill="#1A1530" stroke="#8B5CF6"/><text x="715" y="51" text-anchor="middle" class="stage">L2+ · ADVANCED PILOT</text>
    <line x1="915" y1="44" x2="1410" y2="44" stroke="#27324A" stroke-width="8" stroke-linecap="round"/>
    <line x1="915" y1="44" x2="1275" y2="44" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1275" cy="44" r="13" fill="#8B5CF6"/>
  </g>

  <g transform="translate(70 250)">
    <rect width="1460" height="72" rx="18" fill="#0E131D" stroke="#263047"/>
    <text x="28" y="32" class="name" style="font-size:23px">Crohnoz Forge</text><text x="28" y="56" class="meta">Product discovery · reasoning systems</text>
    <text x="650" y="43" class="stage">L1 · PROTOTYPE / R&amp;D</text>
    <line x1="915" y1="36" x2="1410" y2="36" stroke="#27324A" stroke-width="7" stroke-linecap="round"/><line x1="915" y1="36" x2="1040" y2="36" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/><circle cx="1040" cy="36" r="10" fill="#3B82F6"/>
  </g>

  <g transform="translate(70 338)">
    <rect width="1460" height="72" rx="18" fill="#0E131D" stroke="#263047"/>
    <text x="28" y="32" class="name" style="font-size:23px">Fresh Market</text><text x="28" y="56" class="meta">Retail domain modeling · operational workflows</text>
    <text x="650" y="43" class="stage">L1 · PROTOTYPE / R&amp;D</text>
    <line x1="915" y1="36" x2="1410" y2="36" stroke="#27324A" stroke-width="7" stroke-linecap="round"/><line x1="915" y1="36" x2="1040" y2="36" stroke="#06B6D4" stroke-width="7" stroke-linecap="round"/><circle cx="1040" cy="36" r="10" fill="#06B6D4"/>
  </g>

  <g transform="translate(70 426)">
    <rect width="1460" height="72" rx="18" fill="#0E131D" stroke="#263047"/>
    <text x="28" y="32" class="name" style="font-size:23px">IncluMe</text><text x="28" y="56" class="meta">Accessibility · civic product exploration</text>
    <text x="650" y="43" class="stage">L1 · EARLY PRODUCT</text>
    <line x1="915" y1="36" x2="1410" y2="36" stroke="#27324A" stroke-width="7" stroke-linecap="round"/><line x1="915" y1="36" x2="1040" y2="36" stroke="#EC4899" stroke-width="7" stroke-linecap="round"/><circle cx="1040" cy="36" r="10" fill="#EC4899"/>
  </g>
</svg>