<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc"><title id="title">IncluMe inclusive product R&amp;D case mobile</title><desc id="desc">Mobile case-study header for IncluMe L1 early product.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EC4899"/><stop offset="52%" stop-color="#A855F7"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient><style>.ey{font:800 22px Inter,Arial,sans-serif;letter-spacing:4px;fill:#B7C0CF}.h{font:900 70px Sora,Inter,Arial,sans-serif;fill:#F8FAFC}.sub{font:600 27px Inter,Arial,sans-serif;fill:#C6D0DD}.pill{font:800 22px Inter,Arial,sans-serif;fill:#F8FAFC}.name{font:800 25px Inter,Arial,sans-serif;fill:#F8FAFC}.body{font:500 22px Inter,Arial,sans-serif;fill:#AAB7C7}.flow{font:800 19px Inter,Arial,sans-serif;letter-spacing:.8px;fill:#DDE5EF}</style></defs><rect width="900" height="1120" rx="34" fill="#0A0B14"/><rect x="2" y="2" width="896" height="1116" rx="32" fill="none" stroke="#3A2D4B"/><rect x="0" y="0" width="14" height="1120" rx="7" fill="url(#g)"/><text x="54" y="72" class="ey">INCLUSIVE PRODUCT DESIGN</text><text x="54" y="158" class="h">IncluMe</text><text x="54" y="210" class="sub">Citizen + institutional trust workflow.</text><g transform="translate(54 250)"><rect width="290" height="62" rx="31" fill="#2A1326" stroke="#EC4899"/><text x="145" y="40" text-anchor="middle" class="pill">L1 · EARLY PRODUCT</text></g><g transform="translate(54 360)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#EC4899"/><text x="30" y="48" class="name">CITIZEN DISCOVERY</text><text x="30" y="92" class="body">Map · search · contributions · corrections</text><text x="30" y="132" class="body">Help people find and improve accessibility</text><text x="30" y="164" class="body">information without hiding uncertainty.</text></g><g transform="translate(54 580)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#A855F7"/><text x="30" y="48" class="name">REVIEW BOUNDARY</text><text x="30" y="92" class="body">Citizen input ≠ trusted institutional state</text><text x="30" y="132" class="body">Contribution and verification remain</text><text x="30" y="164" class="body">explicitly separate responsibilities.</text></g><g transform="translate(54 800)"><rect width="792" height="190" rx="24" fill="#101522" stroke="#06B6D4"/><text x="30" y="48" class="name">FEEDBACK LOOP</text><text x="30" y="92" class="body">Submission · review · status · correction</text><text x="30" y="132" class="body">Trust improves through visible evidence</text><text x="30" y="164" class="body">cycles rather than passive map points.</text></g><text x="450" y="1044" text-anchor="middle" class="flow">DISCOVER → REPORT → REVIEW → CORRECT → IMPROVE</text></svg>